name: Transfer verified binary assets
on:
  workflow_dispatch:
    inputs:
      artifact_sha256:
        required: true
        description: SHA-256 of the already verified build artifact
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TRANSFER_URL: ${{ secrets.REI_BINARY_TRANSFER_URL }}
      ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
    steps:
      - name: Download and verify binary-only artifact
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, re, shutil, urllib.request, zipfile
          expected = os.environ['ARTIFACT_SHA256']
          assert re.fullmatch('[0-9a-f]{64}', expected)
          with urllib.request.urlopen(os.environ['TRANSFER_URL'], timeout=60) as src, open('artifact.zip', 'wb') as dst:
              shutil.copyfileobj(src, dst)
          with open('artifact.zip', 'rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == expected
          pathlib.Path('binaries').mkdir()
          allowed = {'REI-Setup-2.0.0.exe', 'REI-Portable-2.0.0.zip'}
          with zipfile.ZipFile('artifact.zip') as archive:
              assert allowed.issubset(archive.namelist())
              for name in sorted(allowed):
                  with archive.open(name) as src, open(pathlib.Path('binaries') / name, 'wb') as dst:
                      shutil.copyfileobj(src, dst)
          PY
      - name: Upload binaries to existing draft
        run: gh release upload v2.0.0-alpha.2 --repo "$GITHUB_REPOSITORY" binaries/REI-Setup-2.0.0.exe binaries/REI-Portable-2.0.0.zip --clobber
